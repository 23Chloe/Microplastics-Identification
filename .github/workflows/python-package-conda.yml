name: Release package validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile published Python sources
        run: python -m compileall -q pipeline models
      - name: Validate repository release structure
        run: python scripts/validate_release.py
