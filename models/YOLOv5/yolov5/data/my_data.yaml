# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
# Path to your dataset directory
path: ../../../dataset  # repository-relative dataset root

# Train/val sets
train: train/images
val: val/images
test: test/images

# Classes
nc: 3  # 类别数量
names:
  0: fragment
  1: fiber
  2: film

# Download script (optional)
download: null
